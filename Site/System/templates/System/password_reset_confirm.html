{% extends 'System/base.html' %}

{% block content %}
<div class="membership-page">

    <div class="form-container">

        <h1 class="form-title">
            Set New Password
        </h1>

        <p class="form-subtitle">
            Please enter and confirm your new password below. Ensure it meets the security guidelines.
        </p>

        <form method="post" class="django-automated-form">
            {% csrf_token %}
            
            <div class="django-form-fields-wrapper">
                {{ form.as_p }}
            </div>

            <button type="submit" class="submit-btn">
                Change Password
            </button>
        </form>

    </div>

</div>

<style>
.membership-page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f5f7fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.form-container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.form-title {
    font-size: 30px;
    font-weight: 700;
    color: #001C3D;
    text-align: center;
    margin-bottom: 10px;
}

.form-subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    line-height: 1.5;
    font-size: 15px;
}

/* ===================================================
   DJANGO AUTOMATED FORM OVERRIDES (form.as_p parsing)
   =================================================== */

/* Styles the <p> elements that Django uses as field containers */
.django-form-fields-wrapper p {
    display: flex;
    flex-direction: column;
    margin-bottom: 22px;
    position: relative;
}

/* Styles the labels outputted by Django above inputs */
.django-form-fields-wrapper label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 8px;
    text-align: left;
}

/* Standardizes the generated text/password fields */
.django-form-fields-wrapper input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
}

.django-form-fields-wrapper input:focus {
    border-color: #001C3D;
    box-shadow: 0 0 0 3px rgba(0, 28, 61, 0.05);
}

/* Handles Django's built-in validation help text (ul/li lists or spans) */
.django-form-fields-wrapper .helptext, 
.django-form-fields-wrapper ul.errorlist {
    font-size: 12px;
    color: #64748b;
    line-height: 1.5;
    margin: 6px 0 0 0;
    padding-left: 0;
    list-style: none;
}

/* Highlights form field validation errors matching your global scheme */
.django-form-fields-wrapper ul.errorlist li {
    color: #c62828;
    font-weight: 500;
    background: #ffe5e5;
    padding: 6px 12px;
    border-radius: 6px;
    margin-top: 4px;
}

/* =================================================== */

.submit-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #001C3D;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
}

.submit-btn:hover {
    background: #003b7a;
}

@media(max-width:768px) {
    .form-container {
        padding: 25px;
    }
}
</style>
{% endblock %}
