{% extends 'System/base.html' %}

{% block content %}
<div class="membership-page">

    <div class="form-container">

        <h1 class="form-title">
            Forgot Password?
        </h1>

        <p class="form-subtitle">
            Enter your email address below, and we'll send you a link to reset your password.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-row">

                <div class="form-group full-width">
                    
                    <div class="django-field-wrapper">
                        {{ form.email }}
                    </div>

                    <label>Email Address</label>

                </div>

            </div>

            <button type="submit" class="submit-btn">
                Send Reset Link
            </button>

            <div class="login-link">
                <a href="{% url 'login' %}">
                    &larr; Back to Login
                </a>
            </div>

        </form>

    </div>

</div>

<style>
.membership-page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f5f7fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.form-container {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.form-title {
    font-size: 30px;
    font-weight: 700;
    color: #001C3D;
    text-align: center;
    margin-bottom: 10px;
}

.form-subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 35px;
    line-height: 1.5;
    font-size: 15px;
}

.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 25px; /* Marginally increased for better action separation */
}

.form-group {
    flex: 1;
    position: relative;
}

.full-width {
    width: 100%;
}

/* Targets the native Django input element generated inside {{ form.email }}.
   This ensures it gains your signature login form styles automatically.
*/
.django-field-wrapper input,
.form-control {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    box-sizing: border-box;
    transition: border-color 0.2s;
}

.django-field-wrapper input:focus,
.form-control:focus {
    border-color: #001C3D;
}

.form-group label {
    display: block;
    margin-top: 8px;
    font-size: 14px;
    color: #666;
}

.submit-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #001C3D;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #003b7a;
}

.login-link {
    margin-top: 25px;
    text-align: center;
    color: #666;
}

.login-link a {
    color: #001C3D;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
}

.login-link a:hover {
    color: #003b7a;
    text-decoration: underline;
}

@media(max-width:768px) {
    .form-container {
        padding: 25px;
    }
}
</style>
{% endblock %}
