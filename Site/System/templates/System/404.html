<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 96px;
            margin: 0;
            color: #ff4757;
            font-weight: 800;
        }
        h2 {
            font-size: 28px;
            margin: 10px 0 20px 0;
            color: #1e272e;
        }
        p {
            font-size: 16px;
            color: #777;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #ff4757;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: background 0.2s ease;
        }
        .btn:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>
    <div class="container">
       <h1>404</h1>
       <h2>System Subscription Expired</h2>
       <p>
        The 14-day free service associated with this application has expired and is currently unavailable.
        Please contact the provider to reactivate the subscription and restore access.
       </p>

    </div>
</body>
</html>
