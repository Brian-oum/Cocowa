
{% extends 'System/base.html' %}
{% load static %}

{% block content %}

<div class="membership-page">

    <div class="form-container">

        <h1 class="form-title">
            Membership Registration
        </h1>

        <p class="form-subtitle">
            Create your account to continue
        </p>

        <!-- =========================
             MESSAGES
        ========================== -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert-message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- =========================
             FORM
        ========================== -->
        <form method="POST">

            {% csrf_token %}

            <!-- =========================
                 MEMBER TYPE
            ========================== -->
            <div class="form-row">

                <div class="form-group full-width">

                    <select
                        name="member_type"
                        class="form-control"
                        required
                    >

                        <option value="">
                            Select Member Type
                        </option>

                        <option value="individual">
                            Individual
                        </option>

                        <option value="sacco">
                            Sacco
                        </option>

                        <option value="partner">
                            Partner / Donor
                        </option>

                    </select>

                    <label>
                        Member Type
                    </label>

                </div>

            </div>

            <!-- =========================
                 PHONE + EMAIL
            ========================== -->
            <div class="form-row">

                <div class="form-group">

                    <input
                        type="text"
                        name="phone_number"
                        class="form-control"
                        required
                    >

                    <label>
                        Phone Number
                    </label>

                </div>

                <div class="form-group">

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required
                    >

                    <label>
                        Email Address
                    </label>

                </div>

            </div>

            <!-- =========================
                 PASSWORDS
            ========================== -->
            <div class="form-row">

                <div class="form-group">

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                    <label>
                        Password
                    </label>

                </div>

                <div class="form-group">

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        required
                    >

                    <label>
                        Confirm Password
                    </label>

                </div>

            </div>

            <!-- =========================
                 SUBMIT BUTTON
            ========================== -->
            <button type="submit" class="submit-btn">

                Create Account

            </button>

            <!-- =========================
                 LOGIN LINK
            ========================== -->
            <div class="login-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login Here
                </a>

            </div>

        </form>

    </div>

</div>

<style>

.membership-page{

    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px 20px;

    background:#f5f7fb;
}

.form-container{

    width:100%;
    max-width:700px;

    background:white;

    border-radius:20px;

    padding:40px;

    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.form-title{

    font-size:32px;
    font-weight:700;

    color:#001C3D;

    text-align:center;

    margin-bottom:10px;
}

.form-subtitle{

    text-align:center;

    color:#666;

    margin-bottom:40px;
}

.form-row{

    display:flex;
    gap:20px;

    margin-bottom:25px;

    flex-wrap:wrap;
}

.form-group{

    flex:1;

    position:relative;
}

.full-width{

    width:100%;
}

.form-control{

    width:100%;

    padding:15px;

    border:1px solid #ddd;

    border-radius:10px;

    outline:none;

    font-size:15px;

    background:white;
}

.form-control:focus{

    border-color:#001C3D;
}

.form-group label{

    display:block;

    margin-top:8px;

    font-size:14px;

    color:#666;
}

.submit-btn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#001C3D;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:0.3s;
}

.submit-btn:hover{

    background:#003b7a;
}

.login-link{

    margin-top:20px;

    text-align:center;

    color:#666;
}

.login-link a{

    color:#001C3D;

    font-weight:600;

    text-decoration:none;
}

.alert-message{

    background:#ffe5e5;

    color:#c62828;

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;
}

@media(max-width:768px){

    .form-row{

        flex-direction:column;
    }

    .form-container{

        padding:25px;
    }
}

</style>

{% endblock %}
