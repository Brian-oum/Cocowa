{% extends 'System/base.html' %}

{% block content %}
<div class="membership-page">

    <div class="form-container success-container">

        <div class="success-badge-wrapper animated-pop">
            <div class="success-checkmark-animated"></div>
        </div>

        <h1 class="form-title">
            Password Changed!
        </h1>

        <p class="form-subtitle">
            Your password has been reset successfully. You can now use your new password to log into your dashboard account.
        </p>

        <div class="login-action-box">
            <a href="{% url 'login' %}" class="submit-btn primary-redirect-btn">
                Log In to Your Account
            </a>
        </div>

    </div>

</div>

<style>
.membership-page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
    background: #f5f7fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.form-container {
    width: 100%;
    max-width: 500px;
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    text-align: center;
}

/* ===================================================
   ANIMATION RULES FOR THE BADGE & CHECKMARK
   =================================================== */

/* Soft background pop-in circle */
.success-badge-wrapper {
    width: 80px;
    height: 80px;
    background: #ecfdf5; 
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px auto;
}

.animated-pop {
    animation: circlePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

/* Custom drawing checkmark container */
.success-checkmark-animated {
    display: block;
    width: 14px;
    height: 26px;
    border: solid #10b981;
    border-width: 0 4px 4px 0;
    transform: rotate(45deg);
    margin-bottom: 4px;
    
    /* We initialize state with zero width/height, then run sequential animations */
    width: 0;
    height: 0;
    animation: 
        drawShortStem 0.2s ease-out 0.3s forwards, 
        drawLongStem 0.25s ease-out 0.5s forwards;
}

/* Keyframes: Pops the circular wrapper forward */
@keyframes circlePop {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

/* Keyframes: Draws the base short tick mark first */
@keyframes drawShortStem {
    0% { width: 0; }
    100% { width: 14px; }
}

/* Keyframes: Draws the final rising stem second */
@keyframes drawLongStem {
    0% { height: 0; }
    100% { height: 26px; }
}

/* =================================================== */

.form-title {
    font-size: 28px;
    font-weight: 700;
    color: #001C3D;
    margin-bottom: 12px;
}

.form-subtitle {
    color: #475569;
    margin-bottom: 32px;
    line-height: 1.6;
    font-size: 15px;
}

/* NATIVE LOOK ACTION CALL BUTTON */
.primary-redirect-btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #001C3D;
    color: white !important;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    box-sizing: border-box;
    transition: background 0.3s ease;
}

.primary-redirect-btn:hover {
    background: #003b7a;
    text-decoration: none !important;
}

@media(max-width:768px) {
    .form-container {
        padding: 35px 20px;
    }
}
</style>
{% endblock %}
